<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop shadows for paper-cut layered depth -->
    <filter id="shadow-dark" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b101d" flood-opacity="0.55"/>
    </filter>
    <filter id="shadow-pin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0b101d" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow-eye" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#0b101d" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-mint" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="circle-clip">
      <circle cx="256" cy="245" r="185"/>
    </clipPath>
  </defs>

  <!-- Clean transparent canvas -->

  <!-- Main Emblem Group -->
  <g id="birdbook-emblem">
    <!-- Outer Navy Rim Base with Pin Projection -->
    <path d="M 256 50 
             A 195 195 0 1 1 168 418 
             L 256 468 
             L 344 418 
             A 195 195 0 0 1 256 50 Z" 
          fill="#1b2038" 
          filter="url(#shadow-dark)"/>

    <!-- Inside Circle Content (Clipped) -->
    <g clip-path="url(#circle-clip)">
      <!-- Base Layer: Deep Forest Teal -->
      <rect x="60" y="50" width="392" height="392" fill="#18565e"/>

      <!-- Delicate Dashed Flight Path Lines -->
      <path d="M 235 155 C 275 140, 315 150, 345 175 C 375 200, 360 260, 305 260 C 270 260, 260 305, 290 325 C 325 345, 365 330, 400 305" 
            fill="none" 
            stroke="#0e3a40" 
            stroke-width="3" 
            stroke-dasharray="4, 5" 
            stroke-linecap="round"/>

      <path d="M 220 190 C 260 180, 290 195, 305 220" 
            fill="none" 
            stroke="#0e3a40" 
            stroke-width="2.5" 
            stroke-dasharray="3, 4" 
            stroke-linecap="round"/>

      <!-- Glowing Mint-Cyan Waypoint Stars / Fireflies along flight path -->
      <g filter="url(#glow-mint)">
        <circle cx="236" cy="155" r="4.5" fill="#a4f5d8"/>
        <circle cx="290" cy="144" r="5" fill="#a4f5d8"/>
        <circle cx="340" cy="168" r="4" fill="#a4f5d8"/>
        <circle cx="360" cy="210" r="4" fill="#a4f5d8"/>
        <circle cx="310" cy="260" r="4.5" fill="#a4f5d8"/>
        <circle cx="275" cy="295" r="4" fill="#a4f5d8"/>
        <circle cx="315" cy="328" r="4.5" fill="#a4f5d8"/>
        <circle cx="370" cy="324" r="5" fill="#a4f5d8"/>
        <circle cx="265" cy="184" r="3.5" fill="#a4f5d8"/>
      </g>

      <!-- Left Slate-Grey Bird Shape Layer with Beak -->
      <path d="M 256 60 
               A 185 185 0 0 0 71 245 
               C 71 315, 115 375, 175 408 
               C 175 365, 185 320, 205 285 
               C 185 275, 160 270, 145 260 
               C 180 250, 210 230, 225 195 
               C 235 170, 245 110, 256 60 Z" 
            fill="#727f8f" 
            filter="url(#shadow-dark)"/>

      <!-- Dark Navy Division Stroke between Slate & Teal -->
      <path d="M 256 60 
               C 245 110, 235 170, 225 195 
               C 210 230, 180 250, 145 260 
               C 160 270, 185 275, 205 285 
               C 185 320, 175 365, 175 408" 
            fill="none" 
            stroke="#1b2038" 
            stroke-width="12" 
            stroke-linejoin="round" 
            stroke-linecap="round"/>

      <!-- Top-Left Bird Eye (Big Round Eye) -->
      <g filter="url(#shadow-eye)">
        <!-- White Eyeball -->
        <circle cx="165" cy="195" r="42" fill="#ffffff" stroke="#1b2038" stroke-width="10"/>
        <!-- Navy Pupil looking up-left -->
        <circle cx="152" cy="186" r="19" fill="#1b2038"/>
        <!-- Soft highlight -->
        <circle cx="160" cy="180" r="4" fill="#ffffff"/>
      </g>

      <!-- Right Bird Eye (Massive Round Eye) -->
      <g filter="url(#shadow-eye)">
        <!-- White Eyeball -->
        <circle cx="372" cy="254" r="66" fill="#ffffff" stroke="#1b2038" stroke-width="12"/>
        <!-- Navy Pupil looking left -->
        <circle cx="355" cy="254" r="28" fill="#1b2038"/>
        <!-- Crescent/Highlight reflection in pupil -->
        <path d="M 364 244 A 12 12 0 0 1 364 264 A 8 8 0 0 0 364 244 Z" fill="#ffffff"/>
      </g>

      <!-- Center Small Bird Silhouette -->
      <g filter="url(#shadow-dark)">
        <!-- Small bird head & beak profile in warm slate grey -->
        <path d="M 270 290 
                 C 255 250, 230 248, 210 258 
                 L 190 266 
                 L 208 278 
                 C 205 295, 208 320, 220 345 
                 L 275 345 
                 C 278 325, 276 305, 270 290 Z" 
              fill="#8d9aa7" 
              stroke="#1b2038" 
              stroke-width="10" 
              stroke-linejoin="round"/>
        <!-- Small Bird Eye Dot -->
        <circle cx="228" cy="265" r="6.5" fill="#1b2038"/>
      </g>
    </g>

    <!-- Location Pin at Bottom (Clean White with Dark Navy Border) -->
    <g filter="url(#shadow-pin)">
      <!-- Pin Teardrop / Marker Outline -->
      <path d="M 256 462 
               L 204 380 
               A 58 58 0 1 1 308 380 
               Z" 
            fill="#ffffff" 
            stroke="#1b2038" 
            stroke-width="12" 
            stroke-linejoin="round"/>
      <!-- Hollow Hole in Center of Pin -->
      <circle cx="256" cy="358" r="18" fill="#1b2038"/>
    </g>
  </g>
</svg>
